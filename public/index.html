  <body>

    <noscript>
      <main style="font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; color: #282722;">
        <h1>Typo Hunter</h1>
        <p><strong>The world is full of typos. Someone has to collect them.</strong></p>
        <p>
          Typo Hunter is a free app for photographing and collecting language mistakes found in the wild: menus offering
          "Soap of the Day", signs that went badly wrong, rogue apostrophes and hilarious translations. Write down what it
          said and what it meant, and build your own typo museum.
        </p>
        <h2>Who it's for</h2>
        <ul>
          <li><strong>Collectors:</strong> keep every funny sign in one place, with the story behind it.</li>
          <li><strong>Friends:</strong> phone-to-phone QR games with no internet needed: Quick Duel, Speed Blitz and squad battles.</li>
          <li><strong>Teachers:</strong> run a class typo hunt; students hand in their photos and you approve each one.</li>
          <li><strong>Language learners and travellers:</strong> learn from real mistakes and keep the best translations.</li>
        </ul>
        <p>Private by design: no account, no tracking, and your photos stay on your device. Works offline.</p>
        <p>Typo Hunter needs JavaScript to run. Please enable it, or read the <a href="/privacy.html">privacy policy</a>.</p>
      </main>
    </noscript>
    <script type="module" src="../src/main.tsx"></script>
